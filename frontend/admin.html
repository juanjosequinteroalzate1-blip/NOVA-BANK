
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA BANK | Administración</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <header class="encabezado">
        <a href="index.html" class="logo">NOVA BANK</a>
        <span>PANEL DE ADMINISTRACIÓN</span>
    </header>

    <main class="contenedor-login">

        <section class="tarjeta-login">

            <div class="icono-banco">N</div>

            <h1>Acceso administrativo</h1>

            <p>Ingresa tus credenciales para administrar NOVA BANK.</p>

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo"
                    placeholder="Correo del administrador">
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password"
                    placeholder="Ingresa tu contraseña">
            </div>

            <button id="btnIngresar">INGRESAR</button>

            <p id="mensaje"></p>

            <a href="index.html">Volver al inicio</a>

        </section>

    </main>

    <footer>
        <p>© 2026 NOVA BANK - Simulador Bancario Web</p>
    </footer>

    <script src="js/admin.js"></script>

</body>
</html>
